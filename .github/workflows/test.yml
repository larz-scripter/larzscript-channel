name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install larzscript
        run: curl -fsSL https://raw.githubusercontent.com/larz-scripter/larzscript/main/install.sh | sh
      - name: syntax check
        # Every dependency is vendored under lib/vendor/ and imported by
        # relative path - resolved by larzvendor, which found uuid's
        # internal import of random without being told about it.
        run: |
          larzscript --check lib/moneyx.lz
          larzscript --check lib/channel.lz
          larzscript --check bin/larzchannel.lz
      - name: run tests
        run: sh tests/run_tests.sh
      - name: run demo
        run: sh examples/demo.sh
